      - name: Unpack the project from the zip
        run: |
          set -euo pipefail
          ZIPS=$(ls RUI-Racing-source*.zip 2>/dev/null || true)
          COUNT=$(echo "$ZIPS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one RUI-Racing-source*.zip at the repo root, found $COUNT:"
            echo "$ZIPS"
            exit 1
          fi
          echo "using $ZIPS"
          unzip -q "$ZIPS" -d project
          test -f project/package.json
