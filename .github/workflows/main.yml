name: Build RUI Racing APK & AAB

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project from the zip
        run: |
          set -euo pipefail
          unzip -q RUI-Racing-source.zip -d project
          test -f project/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: project
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci

      - name: Build the web game
        working-directory: project
        run: npm run build

      - name: Sync web assets into the Android project
        working-directory: project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing - add the four secrets first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.keystore"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('project/android/**/*.gradle', 'project/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK and AAB
        working-directory: project/android
        env:
          RUI_KEYSTORE_PATH: ${{ runner.temp }}/keys/release.keystore
          RUI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RUI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUI_VERSION_CODE: ${{ github.run_number }}
          RUI_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        working-directory: project
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk   out/RUI-Racing.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/RUI-Racing.aab
          ls -lh out/

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs project/out/RUI-Racing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RUI-Racing-apk
          path: project/out/RUI-Racing.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RUI-Racing-aab
          path: project/out/RUI-Racing.aab
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            project/out/RUI-Racing.apk
            project/out/RUI-Racing.aab
