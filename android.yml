      - name: Build release APK and AAB
        working-directory: project/android
        env:
          RUI_KEYSTORE_PATH: ${{ runner.temp }}/keys/release.keystore
          RUI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          RUI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'rui' }}
          RUI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'throwaway' }}
        run: |
          set -uo pipefail
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Gradle failure"
              echo '```'
              sed -n '/FAILURE:/,/^\* Try:/p' /tmp/gradle.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "===== GRADLE FAILURE (copied from the log above) ====="
            sed -n '/FAILURE:/,/^\* Try:/p' /tmp/gradle.log || true
            echo "===== END ====="
            exit "$status"
          fi
